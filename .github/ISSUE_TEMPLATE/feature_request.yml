name: 功能建议
description: 希望插件支持的新能力
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在卡在哪里，不要直接写实现方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的想法（可选）
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
